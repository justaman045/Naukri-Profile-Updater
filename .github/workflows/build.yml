name: Build executables

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NaukriProfileManager-windows
            filename: NaukriProfileManager.exe
          - os: ubuntu-latest
            artifact: NaukriProfileManager-linux
            filename: NaukriProfileManager
          - os: macos-latest
            artifact: NaukriProfileManager-macos
            filename: NaukriProfileManager
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file executable
        run: python build.py --onefile

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error