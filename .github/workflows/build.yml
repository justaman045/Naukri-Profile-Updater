name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file executable
        run: python build.py --onefile

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NaukriProfileManager-${{ matrix.os }}
          path: |
            dist/NaukriProfileManager.exe
            dist/NaukriProfileManager
          if-no-files-found: error