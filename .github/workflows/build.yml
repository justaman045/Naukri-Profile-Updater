name: Build executables

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (also bumps the minor version)
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: windows
            arch: x86_64
            path: |
              dist/NaukriProfileManager-*-windows-x86_64.exe
              dist/NaukriProfileManager-*-windows-x86_64-ondir.zip
          - os: ubuntu-latest
            os_label: linux
            arch: x86_64
            path: dist/NaukriProfileManager-*
          - os: macos-15-intel
            os_label: macos
            arch: x86_64
            path: dist/NaukriProfileManager-*
          - os: macos-15
            os_label: macos
            arch: arm64
            path: dist/NaukriProfileManager-*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      # Install the Playwright Chromium browser so build.py can bundle it into
      # the frozen executable for the captcha auto-login flow.
      - name: Install Playwright browser
        run: python -m playwright install chromium

      # Install MinGW on Windows so httpcloak's companion DLL (libwinpthread-1.dll)
      # is available for build.py::_ensure_companion_dlls() and native library
      # loading. The httpcloak wheel ships libgcc_s_seh-1.dll but not
      # libwinpthread-1.dll, so a clean Windows runner fails to load the library.
      - name: Install MinGW (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: choco install mingw -y

      # Fail fast if httpcloak's native library (and its companions) cannot load
      # on this runner - otherwise the build would ship a broken executable.
      - name: Verify httpcloak native library loads
        run: python -c "from src.core.native_lib import ensure_native_lib; print(ensure_native_lib())"

      # Smoke tests (plain scripts, no pytest). Run before building so a
      # regression in native-lib resolution or the captcha login flow breaks
      # CI instead of a release.
      - name: Run smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python src/tests/test_native_lib.py
          python src/tests/test_captcha_auto_login.py

      # Minor bump of the version in pyproject.toml (0.1.0 -> 0.2.0). All four
      # runners check out the same HEAD, so they compute the same version and the
      # artifact names line up for the release job.
      - name: Compute next version
        id: ver
        shell: bash
        run: |
          NEXT=$(python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); a,b,c=(int(x) for x in d["project"]["version"].split(".")); print(f"{a}.{b+1}.0")')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # build.py verifies the artifact it just produced (see tools/verify_bundle.py)
      # and exits non-zero when httpcloak's native library or one of its
      # dependencies is missing. That check is what keeps a "green" build from
      # shipping an executable that dies with "The specified module could not
      # be found" on every user's machine.
      - name: Build single-file executable
        run: python build.py --onefile --versioned --version "${{ steps.ver.outputs.next }}"

      - name: Verify bundle contents
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in dist/NaukriProfileManager-*-${{ matrix.os_label }}-${{ matrix.arch }}*; do
            [ -e "$f" ] || continue
            case "$f" in *.zip) continue ;; esac
            echo "::group::Verifying $f"
            python tools/verify_bundle.py "$f"
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No artifact matched dist/NaukriProfileManager-*-${{ matrix.os_label }}-${{ matrix.arch }}*"
            ls -la dist || true
            exit 1
          fi

      # The onefile executable unpacks itself into %TEMP% on every launch, which
      # is where antivirus software tends to quarantine files (and where a
      # blocked extraction looks exactly like a missing DLL). Ship a one-folder
      # build as well: it runs straight from its own directory, no extraction.
      - name: Build one-folder distribution (Windows)
        if: matrix.os_label == 'windows'
        shell: bash
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          python build.py --version "$NEXT"
          python - <<'PY'
          import os
          import shutil

          version = os.environ["NEXT"]
          base = f"dist/NaukriProfileManager-{version}-windows-x86_64-ondir"
          shutil.make_archive(base, "zip", "dist/NaukriProfileManager")
          print("created", base + ".zip")
          PY

      - name: Upload executable
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.os_label }}-${{ matrix.arch }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    # Publish on every master push; workflow_dispatch only when its `release`
    # input is enabled. The bot's own bump commit carries "[skip ci]" so this
    # workflow does NOT re-trigger on the commit it writes back.
    if: github.event_name == 'push' || inputs.release == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          NEXT=$(python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); a,b,c=(int(x) for x in d["project"]["version"].split(".")); print(f"{a}.{b+1}.0")')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # Duplicate-run guard: rapid sequential pushes can compute the same next
      # version; if a coincidentally-tagged release already exists, stop quietly.
      - name: Check release already exists
        id: check
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.next }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.ver.outputs.next }} already exists — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and rewrite README download links
        if: steps.check.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, pathlib
          v = os.environ["NEXT"]
          for path, pattern in (
              ("pyproject.toml", r'(?m)^(version\s*=\s*")[^"]+(")'),
              ("src/core/version.py", r'(?m)^(_FALLBACK_VERSION\s*=\s*")[^"]+(")'),
          ):
              p = pathlib.Path(path)
              p.write_text(re.sub(pattern, rf"\g<1>{v}\g<2>", p.read_text()))
          p = pathlib.Path("README.md")
          t = re.sub(r"v\d+\.\d+\.\d+", f"v{v}", p.read_text())
          t = re.sub(r"-\d+\.\d+\.\d+-", f"-{v}-", t)
          p.write_text(t)
          print(f"bumped sources and README to {v}")
          PY
          git diff --stat

      - name: Commit bump, push tag
        if: steps.check.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/core/version.py README.md
          git commit -m "chore(release): v$NEXT [skip ci]"
          git tag "v$NEXT"
          # "[skip ci]" in the commit above stops this workflow from re-triggering
          # on the push, so each human push yields exactly one release.
          git push origin HEAD:master "v$NEXT"

      - name: Download all executables
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Flatten assets and write release notes
        if: steps.check.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        shell: bash
        run: |
          mkdir -p assets
          for f in $(find release-assets -type f); do
            cp "$f" assets/
          done
          # Ship the Linux binary as a .zip too: browsers often stall on the
          # 90MB extensionless raw file, and the zip preserves the exec bit.
          # Use Python (not the `zip` CLI) since `zip` is not guaranteed on
          # every runner's PATH.
          linux=$(ls assets | grep -- '-linux-x86_64$' | head -1 || true)
          if [ -n "$linux" ]; then
            python3 -c "import shutil; shutil.make_archive('assets/${linux}', 'zip', 'assets', '${linux}')"
          fi
          ls -1 assets
          prev=$(git ls-remote --tags origin | sed -n 's#.*refs/tags/\(v[0-9.]*\)$#\1#p' | grep -v "^v$NEXT$" | sort -V | tail -1 || true)
          {
            echo "Automated build of Naukri Profile Manager v$NEXT."
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev: https://github.com/${{ github.repository }}/compare/$prev...v$NEXT"
            fi
            echo
            echo "- Windows x86_64: \`.exe\` (single file) and \`-ondir.zip\` (one folder)"
            echo "- Linux x86_64"
            echo "- macOS x86_64 (Intel)"
            echo "- macOS arm64 (Apple Silicon)"
            echo
            echo "Unsigned build — Windows SmartScreen and macOS Gatekeeper may warn; see README."
            echo
            echo "If the Windows \`.exe\` will not start, download the \`-ondir.zip\` instead:"
            echo "it runs from its own folder and never unpacks itself into \`%TEMP%\`."
          } > NOTES.md

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$NEXT" assets/* \
            --repo "${{ github.repository }}" \
            --title "Naukri Profile Manager v$NEXT" \
            --notes-file NOTES.md
